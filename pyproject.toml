[project]
name = "workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "genesis-world>=1.4.5",
    "pillow>=11.3.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=4.57",
]

# ドライバ 575 (CUDA 12.9) に合わせ、torch は cu129 ビルドを使う
[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
